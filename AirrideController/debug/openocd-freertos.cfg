#
# Arduino UNO R4 WiFi (RA4M1) + FreeRTOS thread awareness.
#
# Extends the OpenOCD config shipped in the UNOWIFIR4 variant folder with an
# -rtos setting, so GDB lists every FreeRTOS task instead of only the CPU
# context that happens to be running. Requires the uxTopUsedPriority symbol
# exported by src/DebugHooks.cpp.
#

source [find openocd.cfg]

$_TARGETNAME configure -rtos FreeRTOS
