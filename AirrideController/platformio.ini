; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_secrets.ini

[common]
lib_deps =
	jandrassy/ArduinoOTA@^1.1.1
	symlink://../SharedLibraries/FreeRTOSPort
	symlink://../SharedLibraries/Communication
	symlink://../SharedLibraries/Logger
	symlink://../SharedLibraries/ICanBus
	symlink://../SharedLibraries/CanMessage
	symlink://../SharedLibraries/CanQueue
	symlink://../SharedLibraries/CanMessageIds
	symlink://../SharedLibraries/CanId
	symlink://../SharedLibraries/CanMessages
	symlink://../SharedLibraries/LargeCanMessage
	symlink://../SharedLibraries/LargeCanMessageHandler
build_flags = 
	-DLOG_LEVEL=3

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = 
	${common.lib_deps}
build_flags = ${common.build_flags}
	-DCANTX=10
	-DCANRX=13
	-DOTA_AP_SSID=\"${ota_secrets.ssid}\"
	-DOTA_AP_PASS=\"${ota_secrets.pass}\"
	-DOTA_PASSWORD=\"${ota_secrets.password}\"

[env:uno_r4_wifi_ota]
extends = env:uno_r4_wifi
upload_protocol = custom
upload_port = ${ota_secrets.ip}
extra_scripts = pre:../SharedLibraries/ota_upload.py

[env:uno_r4_wifi_test]
extends = env:uno_r4_wifi_ota
build_flags =
	${env:uno_r4_wifi.build_flags}
	-DTEST_SOLENOIDS

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
lib_deps = 
	${common.lib_deps}
build_flags = ${common.build_flags}
	-DCANTX=11
	-DCANRX=12

; SWD debugging over the onboard ESP32-S3 (CMSIS-DAP). Requires a USB cable,
; the board's ESP32-S3 firmware >= 0.3.0, and flashing over USB (sam-ba), not
; OTA. Build+upload once with this env, then start "PIO Debug" in the IDE.
[env:uno_r4_wifi_debug]
extends = env:uno_r4_wifi
build_type = debug
upload_protocol = sam-ba
debug_tool = cmsis-dap
debug_speed = 1000
debug_init_break = tbreak setup
; TCP gdb port instead of PlatformIO's default pipe transport. Pipe mode
; gives CLion no way to send an async interrupt, so its Pause button is
; dead; over TCP it works. Also lets you attach a second gdb by hand.
debug_port = localhost:3333
debug_server_ready_pattern = Listening on port 3333 for gdb connections
debug_build_flags =
	-Og
	-g3
	-ggdb3
	-fno-omit-frame-pointer
build_flags =
	${env:uno_r4_wifi.build_flags}
	-DDEBUG_HOOKS
	-DconfigUSE_TRACE_FACILITY=1
	-DconfigCHECK_FOR_STACK_OVERFLOW=2
	-DconfigUSE_MALLOC_FAILED_HOOK=1
	-DconfigRECORD_STACK_HIGH_ADDRESS=1

; Same as uno_r4_wifi_debug plus OpenOCD FreeRTOS thread awareness, so GDB's
; `info threads` lists every task. Use this from the CLI or VS Code, NOT from
; CLion: the session connects with the core still in the bootloader, before
; .data init, so pxCurrentTCB holds the previous run's stale pointers and
; OpenOCD reports phantom threads. Plain GDB ignores them; CLion's MI client
; switches to one and locks up its Resume/Pause buttons.
[env:uno_r4_wifi_debug_rtos]
extends = env:uno_r4_wifi_debug
debug_server =
	${platformio.packages_dir}/tool-openocd/bin/openocd
	-s
	${platformio.packages_dir}/framework-arduinorenesas-uno/variants/UNOWIFIR4
	-s
	${platformio.packages_dir}/tool-openocd/openocd/scripts
	-s
	$PROJECT_DIR/debug
	-f
	openocd-freertos.cfg
	-c
	cmsis_dap_vid_pid 0x2341 0x1002
